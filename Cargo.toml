[package]
name = "new-arp-scan"
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"

[workspace]
resolver = "3"
members = ["tools/mac-vendor-updater"]

[workspace.dependencies]
# Used only by tools/mac-vendor-updater so IEEE CSV parsing never enters the privileged scan crate.
csv = { version = "1.4", default-features = false }

[workspace.lints.rust]
# deny, not forbid: libc FFI lives in linux_*/macos_*/interface_validation (see DECISIONS.md).
# Those modules `#![allow(unsafe_code)]`. The updater forbids unsafe entirely.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[features]
default = []
# Embed a generated `ieee-oui.txt` (or a substitute path) in the `new-arp-scan` binary.
# Default and CI builds leave this off. Release builders should run `make update-mac-vendors`
# first, or set `NEW_ARP_SCAN_BUNDLED_MAC_VENDOR_FILE` to the mapping file to compile in.
bundled-mac-vendors = []

[dependencies]
clap = { version = "4.6", features = ["derive", "std"] }
libc = "0.2"

# Property-based testing only. `default-features = false` drops the `fork` and `timeout`
# features, and with them the `rusty-fork` and `tempfile` transitive dependencies; `std` is the
# only feature the invariant tests need.
[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
