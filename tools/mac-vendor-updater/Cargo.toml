[package]
name = "mac-vendor-updater"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
description = "Fetch official IEEE MAC registry CSVs and write arp-scan ieee-oui.txt"

[dependencies]
csv = { workspace = true }
