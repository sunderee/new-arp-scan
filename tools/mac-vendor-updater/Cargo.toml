[package]
name = "mac-vendor-updater"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false
description = "Fetch official IEEE MAC registry CSVs and write arp-scan ieee-oui.txt"

[dependencies]
csv = { workspace = true }
new-arp-scan = { path = "../.." }

# Cargo rejects local overrides alongside `workspace = true`. Mirror the workspace
# lint policy here so this safe-only tool can additionally forbid unsafe code.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
