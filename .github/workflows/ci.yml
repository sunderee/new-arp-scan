name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (format, lint, test)
    # src/linux_socket.rs, src/linux_packet.rs, and the other `cfg(target_os = "linux")` modules
    # are never compiled by the macOS job, so without this job their code and tests ship unchecked.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        # `rustup default stable` only *selects* the toolchain already in the runner image, which
        # can lag the `rust-version` in Cargo.toml (macos-latest has shipped 1.97.1 against our
        # 1.98 floor, failing the build before it starts). `rustup update stable` fetches the
        # current release, matching the "always latest stable" policy in .claude/CLAUDE.md.
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint bundled MAC vendor feature (clippy, warnings denied)
        env:
          NEW_ARP_SCAN_BUNDLED_MAC_VENDOR_FILE: tests/fixtures/ieee-mac-registry.txt
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Hermetic tests only, same as the macOS job: privileged ARP scans on the wire stay manual,
      # so this job never opens a raw AF_PACKET socket for a live scan. IEEE registry downloads
      # stay on `make update-mac-vendors`; tests use fixtures and `--from-dir`.
      - name: Test
        run: cargo test --workspace
      - name: Test bundled MAC vendor feature
        env:
          NEW_ARP_SCAN_BUNDLED_MAC_VENDOR_FILE: tests/fixtures/ieee-mac-registry.txt
        run: cargo test --workspace --features bundled-mac-vendors

  macos:
    name: macOS (format, lint, test)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        # `rustup default stable` only *selects* the toolchain already in the runner image, which
        # can lag the `rust-version` in Cargo.toml (macos-latest has shipped 1.97.1 against our
        # 1.98 floor, failing the build before it starts). `rustup update stable` fetches the
        # current release, matching the "always latest stable" policy in .claude/CLAUDE.md.
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint bundled MAC vendor feature (clippy, warnings denied)
        env:
          NEW_ARP_SCAN_BUNDLED_MAC_VENDOR_FILE: tests/fixtures/ieee-mac-registry.txt
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Hermetic tests only: privileged ARP scans on the wire stay manual (see CONTRIBUTING.md and
      # docs/linux-platform.md), so this job never opens a Berkeley Packet Filter device for a live
      # scan. IEEE registry downloads stay on `make update-mac-vendors`.
      - name: Test
        run: cargo test --workspace
      - name: Test bundled MAC vendor feature
        env:
          NEW_ARP_SCAN_BUNDLED_MAC_VENDOR_FILE: tests/fixtures/ieee-mac-registry.txt
        run: cargo test --workspace --features bundled-mac-vendors
